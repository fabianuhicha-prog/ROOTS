name: Validar web ROOTS
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Comprobar HTML, enlaces locales, catálogo y JavaScript
        run: python3 scripts/validar_web.py
      - name: Verificar ausencia de archivos confidenciales
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.sqlite*' -o -name '.env' \) -print | grep .; then
            echo 'Hay archivos confidenciales en el repositorio'; exit 1
          fi
